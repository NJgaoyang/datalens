name: Backend verification
on:
  push:
    branches: [main, dev20261103, fix/m00-frontend-lock, dev20261104-linux-native]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4.13
        env:
          MYSQL_DATABASE: datalens
          MYSQL_USER: datalens
          MYSQL_PASSWORD: ci-only-datalens-test-password
          MYSQL_ROOT_PASSWORD: ci-only-root-test-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DATALENS_DB_URL: jdbc:mysql://127.0.0.1:3306/datalens?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=DISABLED&allowPublicKeyRetrieval=true
      DATALENS_UPGRADE_DB_URL: jdbc:mysql://127.0.0.1:3306/datalens_upgrade?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=DISABLED&allowPublicKeyRetrieval=true
      DATALENS_DB_USERNAME: datalens
      DATALENS_DB_PASSWORD: ci-only-datalens-test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: server/pom.xml
      - name: Preserve accepted migration bytes
        shell: bash
        run: |
          baseline=67089355b4be6a8dfb3becf1c77347ad9496b14b
          git fetch --no-tags --depth=1 origin "$baseline"
          while IFS= read -r path; do
            git show "$baseline:$path" | cmp - "$path"
          done < <(git ls-tree -r --name-only "$baseline" -- server/src/main/resources/db/migration)
      - name: Validate offline business-evidence gate
        run: python3 -m unittest discover -s tests/acceptance -p 'test_*.py' -v
      - name: Verify toolchain
        run: java -version && mvn -version
      - name: Create isolated schema for additive upgrade acceptance
        run: |
          docker exec '${{ job.services.mysql.id }}' sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -uroot -e "CREATE DATABASE datalens_upgrade; GRANT ALL PRIVILEGES ON datalens_upgrade.* TO \"datalens\"@\"%\";"'
      - name: Compile, unit test and real MySQL/JDBC-session integration test
        run: mvn -B -ntp -f server/pom.xml verify -Pintegration
      - name: Package and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-verification
          path: |
            server/target/surefire-reports/
            server/target/failsafe-reports/
            server/target/datalens-server.jar
          if-no-files-found: warn
          retention-days: 7

