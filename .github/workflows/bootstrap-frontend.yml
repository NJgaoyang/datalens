name: Bootstrap frontend dependency lock
on:
  push:
    branches: [dev20261103]
    paths: ['web/package.json', 'web/scripts/bootstrap-lock.mjs', '.github/workflows/bootstrap-frontend.yml']
permissions:
  contents: read
jobs:
  bootstrap:
    if: github.repository == 'NJgaoyang/datalens'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev20261103
      - name: Determine whether bootstrap is needed
        id: check
        run: |
          if test -f web/package-lock.json; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.needed == 'true'
        with:
          node-version: '22'
      - name: Resolve supported series to exact versions and verify
        if: steps.check.outputs.needed == 'true'
        working-directory: web
        run: |
          node scripts/bootstrap-lock.mjs
          npm ci --no-audit --no-fund
          npm run test
          npm run build
      - name: Commit only the verified package manifest and lockfile
        if: steps.check.outputs.needed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/package.json web/package-lock.json
          git commit -m 'build(m00): lock verified frontend dependencies'
          git push origin HEAD:dev20261103
      - name: Resolved manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dependency-lock
          path: |
            web/package.json
            web/package-lock.json
          if-no-files-found: warn
          retention-days: 7
