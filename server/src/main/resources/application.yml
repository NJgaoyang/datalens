server:
  address: ${DATALENS_BIND_ADDRESS:127.0.0.1}
  port: ${DATALENS_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${DATALENS_COOKIE_SECURE:true}
        same-site: lax
spring:
  application:
    name: datalens-server
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DATALENS_DB_URL:jdbc:mysql://127.0.0.1:13306/datalens?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=DISABLED&allowPublicKeyRetrieval=true}
    username: ${DATALENS_DB_USERNAME:datalens}
    password: ${DATALENS_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 5000
      validation-timeout: 2000
  flyway:
    enabled: true
    clean-disabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${DATALENS_REDIS_HOST:127.0.0.1}
      port: ${DATALENS_REDIS_PORT:16379}
      password: ${DATALENS_REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s
  servlet:
    multipart:
      enabled: false
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis,queryExecutor
logging:
  pattern:
    level: '%5p [requestId=%X{requestId:-}]'
datalens:
  version: '0.1.0'

  capacity:
    # Non-destructive admission guardrails; never expiry/deletion or a disk-capacity promise.
    query:
      total: ${DATALENS_CAPACITY_QUERY_TOTAL:10000}
      per-actor: ${DATALENS_CAPACITY_QUERY_PER_ACTOR:1000}
    conversation:
      total: ${DATALENS_CAPACITY_CONVERSATION_TOTAL:1000}
      per-actor: ${DATALENS_CAPACITY_CONVERSATION_PER_ACTOR:100}
    model:
      total: ${DATALENS_CAPACITY_MODEL_TOTAL:10000}
      per-actor: ${DATALENS_CAPACITY_MODEL_PER_ACTOR:1000}
    chart-assets: ${DATALENS_CAPACITY_CHART_ASSETS:5000}
    chart-assets-per-owner: ${DATALENS_CAPACITY_CHART_ASSETS_PER_OWNER:500}
    chart-previews: ${DATALENS_CAPACITY_CHART_PREVIEWS:10000}
    chart-previews-per-user: ${DATALENS_CAPACITY_CHART_PREVIEWS_PER_USER:1000}
    chart-runs: ${DATALENS_CAPACITY_CHART_RUNS:10000}
    chart-runs-per-user: ${DATALENS_CAPACITY_CHART_RUNS_PER_USER:1000}
    chart-revisions: ${DATALENS_CAPACITY_CHART_REVISIONS:20000}
    chart-revisions-per-chart: ${DATALENS_CAPACITY_CHART_REVISIONS_PER_CHART:1000}
