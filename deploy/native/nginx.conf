# Local HTTP only. Use approved TLS reverse proxy for public access.
limit_req_zone $binary_remote_addr zone=datalens_login:10m rate=10r/m;
server {
    listen 127.0.0.1:8088;
    server_name localhost;
    root /opt/datalens/web/dist;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    client_max_body_size 16k;
    location = /api/v1/auth/login {
        limit_req zone=datalens_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }
    location ~ ^/api/v1/conversations/[A-Za-z0-9-]+/turns$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 150s;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }
    location = /actuator/health/readiness {
        proxy_pass http://127.0.0.1:8080;
    }
    location = /actuator/health/liveness {
        proxy_pass http://127.0.0.1:8080;
    }
    location /actuator/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
